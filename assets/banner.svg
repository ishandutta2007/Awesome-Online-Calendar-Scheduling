<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="auto" style="border-radius: 14px; background: linear-gradient(135deg, #090d16 0%, #0f172a 45%, #1e1b4b 100%); overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
  <defs>
    <!-- Background Gradient Grids and Glows -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -0.5px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 18px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 14px;
        fill: #e2e8f0;
      }
      .card-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 11px;
        fill: #64748b;
      }

      /* Animated Elements */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1deg); }
      }
      @keyframes floatDelay {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(14px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes pulsePulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.04); opacity: 1; }
      }
      @keyframes dashAnim {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }

      .animated-bg-blob1 {
        transform-origin: 200px 100px;
        animation: pulseGlow 9s ease-in-out infinite alternate;
      }
      .animated-bg-blob2 {
        transform-origin: 1000px 240px;
        animation: pulseGlow 11s ease-in-out infinite alternate 2s;
      }
      .floating-card-1 {
        transform-origin: center;
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        transform-origin: center;
        animation: floatDelay 8.5s ease-in-out infinite;
      }
      .pulsing-pill {
        animation: pulsePulse 4s ease-in-out infinite;
      }
      .network-flow {
        stroke-dasharray: 6 6;
        animation: dashAnim 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Ambient Glowing Nebulas (Deep Background) -->
  <g opacity="0.45">
    <circle class="animated-bg-blob1" cx="180" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="animated-bg-blob2" cx="1020" cy="220" r="180" fill="#6366f1" filter="url(#glow)" />
    <circle cx="600" cy="340" r="130" fill="#a855f7" filter="url(#soft-glow)" opacity="0.3" />
  </g>

  <!-- Geometric Grid Background Pattern -->
  <g stroke="#334155" stroke-opacity="0.18" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="320" y1="0" x2="320" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="560" y1="0" x2="560" y2="360" />
    <line x1="680" y1="0" x2="680" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1040" y1="0" x2="1040" y2="360" />

    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Connecting Network Curves (Background Accent) -->
  <g fill="none" stroke="url(#primary-grad)" stroke-width="2" opacity="0.35">
    <path class="network-flow" d="M 680 80 C 800 30, 880 180, 1020 140 S 1140 240, 1190 200" />
    <path class="network-flow" d="M 720 320 C 840 280, 930 90, 1080 100" />
  </g>

  <!-- Dynamic Floating Decorative Component 1: Booking Slot Widget (Right Wing Background) -->
  <g class="floating-card-1" transform="translate(860, 48)">
    <rect width="270" height="124" rx="16" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    <!-- Header of mini-card -->
    <rect x="18" y="18" width="34" height="34" rx="10" fill="#38bdf8" fill-opacity="0.15" />
    <path d="M 28 32 L 42 32 M 35 25 L 35 39" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <text x="62" y="32" class="card-title">Discovery Sync</text>
    <text x="62" y="46" class="card-sub">45 min • Google Meet &amp; CalDAV</text>

    <!-- Mini booking pills inside card -->
    <rect x="18" y="70" width="70" height="32" rx="8" fill="#6366f1" fill-opacity="0.25" stroke="#6366f1" stroke-opacity="0.5" />
    <text x="53" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#e0e7ff">09:30 AM</text>

    <rect x="96" y="70" width="70" height="32" rx="8" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" />
    <text x="131" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#7dd3fc">11:00 AM</text>

    <rect x="174" y="70" width="76" height="32" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-opacity="0.4" />
    <text x="212" y="90" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7">02:15 PM</text>
  </g>

  <!-- Dynamic Floating Decorative Component 2: Protocol Status Badge (Right Lower Background) -->
  <g class="floating-card-2" transform="translate(800, 195)">
    <rect width="250" height="110" rx="16" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="36" cy="38" r="8" fill="#10b981" />
    <circle cx="36" cy="38" r="14" fill="#10b981" fill-opacity="0.25" />
    <text x="58" y="36" class="card-title">CalDAV &amp; iCal Synced</text>
    <text x="58" y="52" class="card-sub">Realtime 2-Way Conflict Engine</text>

    <!-- Mini Progress / Availability Bar -->
    <rect x="22" y="74" width="206" height="8" rx="4" fill="#334155" />
    <rect x="22" y="74" width="154" height="8" rx="4" fill="url(#primary-grad)" />
    <text x="22" y="98" font-family="-apple-system, sans-serif" font-size="10" font-weight="500" fill="#94a3b8">75% Slots Reserved Today</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle & Badges (Completely Clear and Unobscured) -->
  <g transform="translate(75, 52)">
    <!-- Category Tag / Top Badge -->
    <g class="pulsing-pill">
      <rect x="0" y="0" width="310" height="32" rx="16" fill="url(#accent-cyan)" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="30" y="21" class="pill-text">CURATED PRODUCTIVITY ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text class="title-text" x="0" y="0">
        Awesome Online Calendar
      </text>
      <text class="title-text" x="0" y="52" fill="url(#primary-grad)">
        &amp; Scheduling Systems
      </text>
    </g>

    <!-- Clear Foreground Subtitle -->
    <text class="subtitle-text" x="0" y="172">
      Top SaaS Platforms, Open-Source CalDAV Servers &amp; Self-Hosted Booking Engines
    </text>

    <!-- Feature Attribute Micro-Badges -->
    <g transform="translate(0, 204)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="112" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="56" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">⚡ SaaS Titans</text>

      <!-- Badge 2 -->
      <rect x="122" y="0" width="134" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="189" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🔒 Self-Hosted FOSS</text>

      <!-- Badge 3 -->
      <rect x="266" y="0" width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="330" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">📅 CalDAV / CardDAV</text>

      <!-- Badge 4 -->
      <rect x="404" y="0" width="128" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="468" y="17" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#cbd5e1">🤖 AI &amp; MCP Native</text>
    </g>
  </g>

</svg>
